apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foodsense-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Maksm4/FoodSense
    targetRevision: dev
    path: K8S/Overlays/Dev
  destination:
    server: https://kubernetes.default.svc
    namespace: foodsense
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true