name: Frontend CI

on:
  pull_request:
    branches: [ "dev" , "prod"]
    paths: [ 'src/Frontend/**' ]
  push:
    branches:
      - dev
      - prod
      - 'feature/**'
    paths: ['src/Frontend/**']

jobs:
  build-frontend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Set repo name to lowercase
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v5
        with:
          context: src/Frontend
          file: src/Frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod' }}
          tags: ghcr.io/${{ env.REPO }}/react-frontend:${{ github.sha }}

      - name: Update kustomize image tag
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod'
        run: |
          chmod +x .github/scripts/update-image-tag.sh
          .github/scripts/update-image-tag.sh \
            "react-frontend" \
            "ghcr.io/${{ env.REPO }}/react-frontend" \
            "${{ github.sha }}"