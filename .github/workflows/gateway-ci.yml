name: Gateway CI 

on:
  pull_request: 
    branches: [ "dev" ]
    paths: [ 'src/Gateway/**' ]
  push: 
    branches: [ "dev" ]
    paths: [ 'src/Gateway/**' ]

jobs:
  build-gateway:
    uses: ./.github/workflows/template-ci.yml
    with:
      service: 'gateway'
      project_path: 'src/Gateway/Gateway.sln'
      dockerfile: 'src/Gateway/ApiGateway/Dockerfile'
      push: ${{ github.event_name == 'push' }}
      run_tests: false