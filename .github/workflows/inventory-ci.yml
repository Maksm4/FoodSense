name: Inventory CI 

on:
  pull_request: 
    branches: [ "dev" ]
    paths: [ 'src/Services/Inventory/**', 'src/Common/**' ]

  push: 
    branches: [ "dev" ]
    paths: [ 'src/Services/Inventory/**', 'src/Common/**' ]


jobs:
  build-inventory:
    uses: ./.github/workflows/template-ci.yml
    with:
      service: 'inventory'
      project_path: 'src/Services/Inventory/Inventory.sln'
      dockerfile: 'src/Services/Inventory/Inventory.API/Dockerfile'
      push: ${{ github.event_name == 'push' }}