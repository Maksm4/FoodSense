name: CI .NET Template

on:
  workflow_call:
    inputs:
      service:
        description: service name to use as tag for the image must be lowercase
        required: true
        type: string
      project_path:
        description: services .sln path
        required: true
        type: string
      dockerfile:
        description: path to dockerfile
        required: true
        type: string
      docker_context:
        description: directory of docker build context
        required: false
        type: string
        default: .
      push: 
        description: Push image to registry
        required: false
        type: boolean
        default: false
      run_tests:
        description: Run unit tests
        required: false
        type: boolean
        default: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions: 
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Setup .NET 
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Run Unit Tests
        if: ${{ inputs.run_tests }}
        run: dotnet test ${{ inputs.project_path }} --configuration Release

      - name: Setup docker buildx engine
        uses: docker/setup-buildx-action@v3

      - name: Set repo name to lowercase
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push images
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ env.REPO }}/${{ inputs.service }}:${{ github.sha }}